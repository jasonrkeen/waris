name: Synthetic release checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m compileall -q main.py app.py offline_demo.py src tests
      - run: python -m pytest -q
      - run: python offline_demo.py
      - run: python -c "from streamlit.testing.v1 import AppTest; a=AppTest.from_file('app.py',default_timeout=30).run(); assert not a.exception, a.exception"
